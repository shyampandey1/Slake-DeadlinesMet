name: Next.js CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Using a single, current LTS version of Node.js is sufficient for most CI build checks
        node-version: [20.x]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        # Optional: Caching npm dependencies can speed up subsequent runs
        cache: 'npm'

    - name: Install Dependencies and Build
      # This step installs dependencies and then runs the Next.js production build command
      run: |
        npm install
        npm run build