name: Hourly Notifications Trigger

on:
  schedule:
    - cron: '0 * * * *' # Every hour
  workflow_dispatch: # Allow manual trigger

jobs:
  trigger-notifications:
    runs-on: ubuntu-latest
    steps:
      - name: Hit Notification API
        run: |
          curl -X GET "https://slake-deadlines-met.vercel.app/api/cron/notifications" \
          -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
